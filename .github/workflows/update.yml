name: Weekday morning stock watch update

on:
  schedule:
    # 平日 朝7:00 JST = 前日22:00 UTC（月〜金 22:00 UTC = 火〜土 07:00 JST）
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update pipeline
        id: pipeline
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python -m src.main | tee pipeline_result.json

      - name: Commit updated database and public JSON (never delete past data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.db site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily watchlist data update $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

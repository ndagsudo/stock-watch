<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アイコン生成ツール</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #0b1220; color: #e5e9f0; }
    h1 { color: #4fd1a5; margin-bottom: 20px; }
    canvas { display: none; }
    .btn { display:inline-block; padding:12px 24px; background:#1f6f54; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:15px; margin:8px 0; }
    p { margin:10px 0; color:#b8c2d4; line-height:1.6; }
    .note { background:#132233; border-left:4px solid #4fd1a5; padding:12px 16px; border-radius:0 8px 8px 0; margin-top:20px; }
    code { color:#4fd1a5; }
  </style>
</head>
<body>
  <h1>📈 アイコン生成ツール</h1>
  <p>このページをブラウザで開き、下のボタンでアイコンPNGを生成・ダウンロードしてください。<br>
     ダウンロードしたファイルを <code>icons/</code> フォルダに配置してください。</p>

  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>

  <br>
  <button class="btn" onclick="generate(192)">icon-192.png をダウンロード</button><br>
  <button class="btn" onclick="generate(512)">icon-512.png をダウンロード</button>

  <div class="note">
    <strong>配置先：</strong><code>site/icons/icon-192.png</code> と <code>icon-512.png</code><br>
    ホーム画面に追加する前に配置してください（未配置でもアプリ自体は動作します）。
  </div>

  <script>
    function generate(size) {
      const canvas = document.getElementById('c' + size);
      const ctx = canvas.getContext('2d');
      const s = size;
      const unit = s / 192;

      const grad = ctx.createLinearGradient(0, 0, s, s);
      grad.addColorStop(0, '#0b1220');
      grad.addColorStop(1, '#1f6f54');
      ctx.fillStyle = grad;
      roundRect(ctx, 0, 0, s, s, s * 0.22);
      ctx.fill();

      // 上昇チャートのライン
      ctx.strokeStyle = '#4fd1a5';
      ctx.lineWidth = 9 * unit;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s * 0.22, s * 0.62);
      ctx.lineTo(s * 0.40, s * 0.46);
      ctx.lineTo(s * 0.55, s * 0.56);
      ctx.lineTo(s * 0.78, s * 0.28);
      ctx.stroke();

      // 矢印の先端
      ctx.fillStyle = '#4fd1a5';
      ctx.beginPath();
      ctx.moveTo(s * 0.78, s * 0.28);
      ctx.lineTo(s * 0.64, s * 0.30);
      ctx.lineTo(s * 0.76, s * 0.40);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(20 * unit)}px -apple-system,sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('株監視', s * 0.5, s * 0.84);

      const link = document.createElement('a');
      link.download = 'icon-' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
  </script>
</body>
</html>
